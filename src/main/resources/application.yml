spring:
  application:
    name: daily-discover-server

  datasource:
    url: jdbc:postgresql://192.168.1.63:5432/daily_discover
    username: postgres
    password: "postgres"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  file:
    name: /home/sshuser/logs/daily-discover/server.log
  logback:
    rollingpolicy:
      file-name-pattern: /home/sshuser/logs/daily-discover/server.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.dailydiscover: INFO

daily-discover:
  anonymous-header: X-Anonymous-Id
