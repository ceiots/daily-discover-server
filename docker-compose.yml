services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: daily-discover-server:latest
    container_name: daily-discover-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/sshuser/logs/daily-discover:/home/sshuser/logs/daily-discover
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/daily_discover
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - LOGGING_FILE_NAME=/home/sshuser/logs/daily-discover/server.log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

